version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      development-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
